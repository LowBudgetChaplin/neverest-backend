services:
  postgres:
    image: postgres:16
    container_name: neverest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neverest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - neverest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neverest"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neverest-postgres-data:
