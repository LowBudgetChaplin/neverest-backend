services:
  mysql:
    image: mysql:8.4
    container_name: neverest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: neverest
      MYSQL_USER: neverest
      MYSQL_PASSWORD: neverest
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    ports:
      - "3306:3306"
    volumes:
      - neverest-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neverest-mysql-data:
