spring.application.name=neverest
server.port=${SERVER_PORT:8080}
spring.datasource.url=${NEV_DB_URL:jdbc:h2:mem:neverest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${NEV_DB_USER:sa}
spring.datasource.password=${NEV_DB_PASSWORD:}
spring.datasource.driver-class-name=${NEV_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
neverest.auth.provider=none
neverest.firebase.project-id=
neverest.integrations.whatsapp.enabled=false
neverest.integrations.whatsapp.webhook-url=
neverest.integrations.strava.enabled=false
neverest.integrations.strava.webhook-url=
neverest.integrations.timeout-seconds=5
neverest.integrations.retry.enabled=true
neverest.integrations.retry.fixed-delay-ms=60000
neverest.integrations.retry.batch-size=25
neverest.integrations.retry.max-attempts=5
neverest.integrations.retry.backoff-seconds=120
