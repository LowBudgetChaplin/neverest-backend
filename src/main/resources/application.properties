spring.application.name=neverest
server.port=${SERVER_PORT:8080}
spring.datasource.url=${NEV_DB_URL:jdbc:mysql://127.0.0.1:3306/neverest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${NEV_DB_USER:root}
spring.datasource.password=${NEV_DB_PASSWORD:pacKhard10}
spring.datasource.driver-class-name=${NEV_DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
neverest.auth.provider=none
neverest.firebase.project-id=
neverest.integrations.whatsapp.enabled=false
neverest.integrations.whatsapp.webhook-url=
neverest.integrations.strava.enabled=false
neverest.integrations.strava.webhook-url=
neverest.integrations.timeout-seconds=5
neverest.integrations.retry.enabled=true
neverest.integrations.retry.fixed-delay-ms=60000
neverest.integrations.retry.batch-size=25
neverest.integrations.retry.max-attempts=5
neverest.integrations.retry.backoff-seconds=120
